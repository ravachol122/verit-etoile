```html
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérité Étoile 🍐</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: white;
            font-size: 38px;
            margin-bottom: 35px;
        }

        /* Bouton vert */
        .bouton {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(145deg, #39d353, #087f23);
            cursor: pointer;

            box-shadow:
                0 12px 0 #045c18,
                0 20px 30px rgba(0, 255, 60, 0.35),
                inset 6px 6px 12px rgba(255,255,255,0.25),
                inset -10px -10px 18px rgba(0,0,0,0.35);

            transition: 0.1s;
        }

        .bouton:hover {
            transform: translateY(-3px);
        }

        .bouton:active {
            transform: translateY(9px);

            box-shadow:
                0 3px 0 #045c18,
                0 8px 15px rgba(0, 255, 60, 0.3),
                inset 5px 5px 10px rgba(255,255,255,0.2),
                inset -8px -8px 15px rgba(0,0,0,0.3);
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
        }

        .fenetre {
            background: #181818;
            color: white;
            width: 400px;
            padding: 35px;
            border-radius: 18px;
            text-align: center;

            box-shadow:
                0 0 40px rgba(0, 255, 60, 0.25),
                0 15px 40px rgba(0,0,0,0.8);
        }

        .fenetre h2 {
            margin-top: 0;
            font-size: 24px;
        }

        .fenetre p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .oui, .non {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }

        .oui {
            background: #16a83a;
            color: white;
        }

        .non {
            background: #444;
            color: white;
        }

        .oui:hover {
            background: #20c947;
        }

        .non:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Vérité Étoile 🍐</h1>

        <button class="bouton" onclick="ouvrirConfirmation()"></button>

    </div>

    <div class="overlay" id="confirmation">

        <div class="fenetre">

            <h2>⚠️ Confirmation</h2>

            <p>Es-tu sûre de vouloir faire cela, Sabah ?</p>

            <button class="oui" onclick="confirmer()">Oui</button>
            <button class="non" onclick="fermerConfirmation()">Non</button>

        </div>

    </div>

    <script>

        function ouvrirConfirmation() {
            document.getElementById("confirmation").style.display = "flex";
        }

        function fermerConfirmation() {
            document.getElementById("confirmation").style.display = "none";
        }

        function confirmer() {
            alert("Étoile est en danger 💀");
            fermerConfirmation();
        }

    </script>

</body>
</html>
